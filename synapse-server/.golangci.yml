version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    govet:
      enable:
        - shadow
        - nilness
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
